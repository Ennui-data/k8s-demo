apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Окружение dev: 1 реплика, свой namespace и хост.
# CI обновляет здесь newTag при каждом пуше в main (job update-dev).
namespace: demo-dev

resources:
  - namespace.yaml
  - quota.yaml
  - ../../base
  - ingress.yaml
  - sops-secret.enc.yaml

images:
  - name: k8s-demo
    newName: ghcr.io/ennui-data/k8s-demo
    newTag: sha-2940008
