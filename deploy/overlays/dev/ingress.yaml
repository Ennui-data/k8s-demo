apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-demo
  labels:
    app: k8s-demo
  annotations:
    # Тестовый стенд без TLS: не редиректим http -> https
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: k8s-demo.dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-demo
                port:
                  name: http
