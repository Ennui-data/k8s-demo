apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# CI подменяет newName/newTag на актуальные (ghcr.io/<owner>/k8s-demo:sha-xxxxxxx).
# ВАЖНО: owner указывается в нижнем регистре — GHCR не принимает заглавные буквы.
images:
  - name: k8s-demo
    newName: ghcr.io/owner/k8s-demo
    newTag: latest
