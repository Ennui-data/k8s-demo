apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo
  labels:
    app: k8s-demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: k8s-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: k8s-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      # Мягкое требование: по возможности разводить реплики по нодам
      # (в однонодовом kind просто не действует, на реальном кластере работает).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: k8s-demo
      containers:
        - name: app
          # Тег и registry подставляет kustomize (deploy/overlays/*/kustomization.yaml)
          image: k8s-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          # Секрет создаёт sops-secrets-operator из SopsSecret (см. sops-secret.enc.yaml)
          envFrom:
            - secretRef:
                name: k8s-demo-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # При readOnlyRootFilesystem корень только для чтения, поэтому даём
          # writable-volume в /tmp (нужен gunicorn для служебных файлов воркеров).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
