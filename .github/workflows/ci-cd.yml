name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- тесты
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: ruff (линт + форматирование)
        run: |
          ruff check .
          ruff format --check .

      - name: pytest
        run: pytest -v

  # ------------------------------------------------- сборка образа + smoke
  build:
    name: Сборка образа
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Определяю имя образа и тег
        id: meta
        # ВАЖНО: имена образов в GHCR только в нижнем регистре,
        # а логин/название репозитория могут содержать заглавные буквы.
        run: |
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Логин в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      - name: Smoke-тест контейнера
        run: |
          set -eu
          image="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          tag="${{ steps.meta.outputs.tag }}"

          docker run -d --rm --name smoke -p 18080:8080 "$image"

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "контейнер не поднялся"; docker logs smoke; exit 1; }

          echo "readiness отвечает:"
          curl -fsS http://localhost:18080/readyz

          echo "проверяю JSON /: service=k8s-demo и version=$tag"
          curl -fsS http://localhost:18080/ \
            | jq -e --arg tag "$tag" '.service == "k8s-demo" and .version == $tag'

          docker rm -f smoke

  # --------------------------------------------- деплой в kind (self-hosted)
  deploy:
    name: Деплой в kind
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, kind]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Проверяю kubectl
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kubectl version --client
          kubectl config current-context

      - name: Применяю манифесты и обновляю образ
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"

          sed -i \
            -e "s|newName:.*|newName: ${{ needs.build.outputs.image }}|" \
            -e "s|newTag:.*|newTag: ${{ needs.build.outputs.tag }}|" \
            deploy/kustomization.yaml

          kubectl apply -k deploy/
          kubectl rollout status deployment/k8s-demo --timeout=180s

      - name: Итог
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kubectl get deploy,pods -l app=k8s-demo -o wide
          kubectl get svc k8s-demo
          echo "--- ответ приложения:"
          curl -fsS http://localhost:8080/ || true
