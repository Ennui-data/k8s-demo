name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- тесты
  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -v ./...

  # ------------------------------------------------- сборка образа + smoke
  build:
    name: Сборка образа
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Определяю тег образа
        id: meta
        run: |
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Логин в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      - name: Smoke-тест контейнера
        run: |
          set -eu
          image="$IMAGE:${{ steps.meta.outputs.tag }}"
          docker run -d --rm --name smoke -p 18080:8080 "$image"

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:18080/healthz; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "контейнер не поднялся"; docker logs smoke; exit 1; }

          curl -fsS http://localhost:18080/ | grep -q '"service": "k8s-demo"'
          curl -fsS http://localhost:18080/readyz
          docker rm -f smoke

  # --------------------------------------------- деплой в kind (self-hosted)
  deploy:
    name: Деплой в kind
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, kind]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Проверяю kubectl
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kubectl version --client
          kubectl config current-context

      - name: Применяю манифесты и обновляю образ
        run: |
          set -eu
          export PATH="$HOME/.local/bin:$PATH"

          sed -i \
            -e "s|newName:.*|newName: ${{ needs.build.outputs.image }}|" \
            -e "s|newTag:.*|newTag: ${{ needs.build.outputs.tag }}|" \
            deploy/kustomization.yaml

          kubectl apply -k deploy/
          kubectl rollout status deployment/k8s-demo --timeout=180s

      - name: Итог
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          kubectl get deploy,pods -l app=k8s-demo -o wide
          kubectl get svc k8s-demo
          echo "--- ответ приложения:"
          curl -fsS http://localhost:8080/ || true
