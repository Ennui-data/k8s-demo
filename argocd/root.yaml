# Bootstrap: единственный объект, который создаётся руками (kubectl apply -f argocd/apps/root.yaml).
# Дальше Argo CD сам следит за папкой argocd/apps и создаёт остальные Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-demo-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ennui-data/k8s-demo.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
