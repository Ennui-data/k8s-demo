[project]
name = "k8s-demo"
version = "0.0.0"
description = "Демо CI/CD: Flask-приложение, GitHub Actions, GHCR, деплой в kind"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"
